server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 10m;

  # DNS internal Docker; alamat gateway di-resolve ulang berkala (aman jika container gateway dibuat ulang)
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $gateway http://api-gateway:8080;

  # Frontend HANYA berbicara dengan API Gateway (tidak langsung ke service lain)
  location /api/ {
    proxy_pass $gateway;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }
  location /uploads/ {
    proxy_pass $gateway;
    proxy_set_header Host $host;
  }

  # Vue Router (history mode)
  location / {
    try_files $uri $uri/ /index.html;
  }
}
